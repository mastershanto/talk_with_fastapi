name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: |
          ruff check .

      - name: Typecheck (mypy)
        run: |
          mypy app

      - name: Architecture guard
        run: |
          python scripts/check_architecture.py

      - name: Tests (pytest)
        env:
          # Keep CI hermetic — tests already default to SQLite via tests/conftest.py
          DATABASE_URL: sqlite:///./ci_test.db
          SECRET_KEY: ci-secret
          DEBUG: "false"
        run: |
          pytest --cov=app --cov-config=.coveragerc --cov-report=term-missing --cov-fail-under=72
